<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">USense Logo</title>
  <desc id="desc">Blue and yellow gradient logo with US monogram and microphone mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2890e2"/>
      <stop offset="55%" stop-color="#56b7ef"/>
      <stop offset="100%" stop-color="#f0d54e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6fca"/>
      <stop offset="100%" stop-color="#f0d54e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14428b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="228" height="228" rx="50" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="70" fill="#ffffff" fill-opacity="0.92"/>

  <text x="128" y="142" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-size="72" font-weight="700" fill="url(#txt)">US</text>
  <rect x="172" y="88" width="12" height="62" rx="6" fill="#1f6fca"/>
  <circle cx="178" cy="84" r="14" fill="#f0d54e"/>
</svg>
