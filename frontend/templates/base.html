<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USense Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#1d2433',
              mist: '#dcedff',
              frost: '#f3f8ff',
              tide: '#2890e2',
              deep: '#1f6fca',
              sun: '#f0d54e',
              amber: '#e2bf2f'
            },
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif']
            },
            boxShadow: {
              float: '0 24px 60px rgba(22, 35, 64, 0.18)'
            }
          }
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .rise {
        animation: rise 500ms ease-out both;
      }
    </style>
</head>
<body class="relative m-0 min-h-screen overflow-x-hidden bg-gradient-to-br from-[#e6f2ff] via-[#d7ebff] to-[#fff6cc] font-sans text-ink">
   <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden">
    <div class="absolute -left-24 top-8 h-72 w-72 rounded-full bg-sun/35 blur-3xl"></div>
    <div class="absolute right-[-90px] top-16 h-96 w-96 rounded-full bg-tide/30 blur-3xl"></div>
    <div class="absolute bottom-[-120px] left-1/2 h-96 w-96 -translate-x-1/2 rounded-full bg-amber/30 blur-3xl"></div>
    <svg aria-hidden="true" viewBox="0 0 1000 220" class="absolute left-0 top-20 h-[220px] w-full opacity-20">
      <path d="M0 120c90-70 180-70 270 0s180 70 270 0 180-70 270 0 180 70 270 0" fill="none" stroke="#2890e2" stroke-width="18" stroke-linecap="round"/>
      <path d="M0 170c90-70 180-70 270 0s180 70 270 0 180-70 270 0 180 70 270 0" fill="none" stroke="#f0d54e" stroke-width="14" stroke-linecap="round"/>
    </svg>
   </div>
   <header class="w-full border-b border-ink/10 bg-white/75 backdrop-blur-sm">
    <div class="mx-auto flex w-full max-w-6xl items-center px-6 py-5">
      <div class="flex items-center gap-2">
        <img src="{{ url_for('static', filename='usense-logo.svg') }}" alt="USense logo" class="h-11 w-11 rounded-2xl border border-tide/20 object-cover shadow-md shadow-tide/30">
        <h1 class="font-display text-[1.9rem] font-extrabold tracking-tight text-deep md:text-[2.2rem]">
          <span class="bg-gradient-to-r from-[#0f56b8] via-[#2392ea] to-[#ffd64d] bg-clip-text text-transparent drop-shadow-[0_2px_10px_rgba(31,111,202,0.35)]">USense</span>
        </h1>
      </div>
    </div>
   </header>
    {%block body%}
    <h1> Hello, everyone!</h1>
    {%endblock%}
   
</body>
</html>
